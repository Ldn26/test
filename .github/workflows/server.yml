name: push server image to dockerhub
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

env:
  IMAGE_NAME: yxfldn26/serverimage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set image tag from commit sha
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: build serverImage
        run: docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest ./server

      - name: login to dockerhub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: push serverImage to dockerhub
        run: |
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest
